services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forex
      POSTGRES_PASSWORD: forex
      POSTGRES_DB: forex_agent
    ports:
      - "5432:5432"
    volumes:
      - forex_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forex -d forex_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forex_agent_pgdata:
