<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forex Trading Agent — Backtest Report Viewer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1a1d23;
    --text-dim: #6b7280;
    --accent: #2563eb;
    --win: #15803d;
    --loss: #b91c1c;
    --win-bg: #f0fdf4;
    --loss-bg: #fef2f2;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1c1f26;
      --border: #2c313a;
      --text: #e8eaed;
      --text-dim: #9aa0ab;
      --accent: #60a5fa;
      --win: #4ade80;
      --loss: #f87171;
      --win-bg: #0f2418;
      --loss-bg: #2a1414;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-size: 17px;
    font-weight: 650;
    margin: 0;
  }
  header .sub {
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 2px;
  }
  select {
    font: inherit;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    min-width: 320px;
    max-width: 100%;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px;
  }
  .empty-state {
    text-align: center;
    padding: 80px 24px;
    color: var(--text-dim);
  }
  .empty-state code {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 12.5px;
  }
  .meta-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    padding: 14px 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 18px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .meta-bar b { color: var(--text); font-weight: 600; }
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 18px;
  }
  .metric-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .metric-card .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .metric-card .value {
    font-size: 19px;
    font-weight: 650;
    font-family: var(--mono);
  }
  .metric-card .value.na { color: var(--text-dim); font-weight: 500; font-size: 15px; }
  .metric-card .value.pos { color: var(--win); }
  .metric-card .value.neg { color: var(--loss); }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 18px;
  }
  .panel h2 {
    font-size: 13px;
    font-weight: 650;
    margin: 0 0 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  canvas#equity-chart {
    width: 100%;
    height: 220px;
    display: block;
  }
  .chart-empty {
    color: var(--text-dim);
    text-align: center;
    padding: 40px 0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  th, td {
    text-align: left;
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th {
    color: var(--text-dim);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 10.5px;
    letter-spacing: 0.03em;
  }
  td.num, th.num { text-align: right; font-family: var(--mono); }
  .side-badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 650;
  }
  .side-badge.long { background: var(--win-bg); color: var(--win); }
  .side-badge.short { background: var(--loss-bg); color: var(--loss); }
  .pnl-pos { color: var(--win); }
  .pnl-neg { color: var(--loss); }
  .table-scroll { overflow-x: auto; max-height: 480px; overflow-y: auto; }
  .params-list { font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
  .trade-count-note { color: var(--text-dim); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Backtest Report Viewer</h1>
    <div class="sub">Static local viewer — reads <code>reports/dashboard_data.js</code>, no server required</div>
  </div>
  <select id="run-selector" aria-label="Select backtest run"></select>
</header>

<main id="main"></main>

<script src="reports/dashboard_data.js"></script>
<script>
(function () {
  "use strict";

  var RUNS = window.FTA_BACKTEST_RUNS || [];
  var mainEl = document.getElementById("main");
  var selectorEl = document.getElementById("run-selector");

  function runLabel(run) {
    var strategy = (run.strategy && run.strategy.key) || "unknown-strategy";
    var instrument = run.instrument || "unknown-instrument";
    var from = (run.from || "").slice(0, 10);
    var to = (run.to || "").slice(0, 10);
    return instrument + " — " + strategy + " — " + from + " to " + to;
  }

  function escapeHtml(value) {
    var div = document.createElement("div");
    div.textContent = value === null || value === undefined ? "" : String(value);
    return div.innerHTML;
  }

  function fmtMetric(value, opts) {
    opts = opts || {};
    if (value === null || value === undefined) {
      return '<span class="value na">N/A</span>';
    }
    var cls = "value";
    if (opts.signed) {
      var n = parseFloat(value);
      if (!isNaN(n)) {
        cls += n > 0 ? " pos" : n < 0 ? " neg" : "";
      }
    }
    return '<span class="' + cls + '">' + escapeHtml(value) + "</span>";
  }

  function fmtPercent(value) {
    if (value === null || value === undefined) return '<span class="value na">N/A</span>';
    var n = parseFloat(value);
    if (isNaN(n)) return '<span class="value na">N/A</span>';
    return '<span class="value">' + (n * 100).toFixed(1) + "%</span>";
  }

  function metricCard(label, html) {
    return (
      '<div class="metric-card"><div class="label">' +
      escapeHtml(label) +
      '</div><div>' +
      html +
      "</div></div>"
    );
  }

  function renderEmptyNoReports() {
    mainEl.innerHTML =
      '<div class="empty-state">' +
      "<p>No backtest reports found yet.</p>" +
      "<p>Export one with:</p>" +
      "<code>uv run python scripts/export_backtest_report.py " +
      "--strategy ema_crossover_v1 --instrument EUR_USD " +
      "--from 2024-01-01 --to 2025-12-31</code>" +
      "</div>";
  }

  function renderParams(strategy) {
    var params = (strategy && strategy.parameters) || {};
    var parts = [];
    for (var key in params) {
      if (Object.prototype.hasOwnProperty.call(params, key)) {
        parts.push(key + "=" + params[key]);
      }
    }
    return parts.length ? parts.join(", ") : "(no parameters)";
  }

  function renderMetaBar(run) {
    var strategy = run.strategy || {};
    return (
      '<div class="meta-bar">' +
      "<span>Strategy: <b>" + escapeHtml(strategy.key) + "</b> v" + escapeHtml(strategy.version) + "</span>" +
      '<span>Params: <span class="params-list">' + escapeHtml(renderParams(strategy)) + "</span></span>" +
      "<span>Instrument: <b>" + escapeHtml(run.instrument) + "</b></span>" +
      "<span>Granularity: <b>" + escapeHtml(run.granularity) + "</b></span>" +
      "<span>Source: <b>" + escapeHtml(run.source) + "</b></span>" +
      "<span>Window: <b>" + escapeHtml((run.from || "").slice(0, 10)) + "</b> to <b>" +
        escapeHtml((run.to || "").slice(0, 10)) + "</b></span>" +
      "<span>Generated: " + escapeHtml(run.generated_at) + "</span>" +
      "<span>Commit: " + escapeHtml((run.git_commit || "").slice(0, 12)) + "</span>" +
      "</div>"
    );
  }

  function renderMetrics(m) {
    var cards = [
      metricCard("Trades", fmtMetric(m.trade_count)),
      metricCard("Win Rate", fmtPercent(m.win_rate)),
      metricCard("Profit Factor", fmtMetric(m.profit_factor)),
      metricCard("Expectancy", fmtMetric(m.expectancy, { signed: true })),
      metricCard("Total P&L", fmtMetric(m.total_pnl, { signed: true })),
      metricCard("Max Drawdown", fmtMetric(m.max_drawdown)),
      metricCard("Sharpe", fmtMetric(m.sharpe, { signed: true })),
      metricCard("Sortino", fmtMetric(m.sortino, { signed: true })),
      metricCard("Wins / Losses", fmtMetric(m.win_count + " / " + m.loss_count))
    ];
    return '<div class="metrics-grid">' + cards.join("") + "</div>";
  }

  function drawEquityCurve(canvas, trades) {
    if (!trades.length) return false;
    var ordered = trades.slice().sort(function (a, b) {
      return new Date(a.exit_time) - new Date(b.exit_time);
    });
    var cumulative = [];
    var running = 0;
    for (var i = 0; i < ordered.length; i++) {
      running += parseFloat(ordered[i].pnl);
      cumulative.push(running);
    }

    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    var width = Math.max(rect.width, 300);
    var height = 220;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.height = height + "px";
    var ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, width, height);

    var min = Math.min(0, Math.min.apply(null, cumulative));
    var max = Math.max(0, Math.max.apply(null, cumulative));
    var range = max - min || 1;
    var padTop = 12, padBottom = 20, padLeft = 10, padRight = 10;
    var plotHeight = height - padTop - padBottom;
    var plotWidth = width - padLeft - padRight;

    function xAt(i) {
      return padLeft + (i / Math.max(cumulative.length - 1, 1)) * plotWidth;
    }
    function yAt(v) {
      return padTop + (1 - (v - min) / range) * plotHeight;
    }

    var styles = getComputedStyle(document.documentElement);
    var borderColor = styles.getPropertyValue("--border").trim();
    var accentColor = styles.getPropertyValue("--accent").trim();
    var dimColor = styles.getPropertyValue("--text-dim").trim();

    // zero line
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padLeft, yAt(0));
    ctx.lineTo(width - padRight, yAt(0));
    ctx.stroke();

    // equity curve
    ctx.strokeStyle = accentColor;
    ctx.lineWidth = 1.75;
    ctx.beginPath();
    for (var j = 0; j < cumulative.length; j++) {
      var x = xAt(j), y = yAt(cumulative[j]);
      if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.fillStyle = dimColor;
    ctx.font = "11px -apple-system, sans-serif";
    ctx.fillText("start", padLeft, height - 4);
    ctx.textAlign = "right";
    ctx.fillText("latest trade", width - padRight, height - 4);
    ctx.textAlign = "left";

    return true;
  }

  function renderChartPanel() {
    // The chart panel is a fixed shell; drawEquityCurve() fills the
    // canvas (or chart-wrap gets replaced with an empty-state message)
    // once this HTML is actually in the DOM -- see renderRun().
    return (
      '<div class="panel"><h2>Equity Curve (cumulative P&amp;L by exit time)</h2>' +
      '<div id="chart-wrap"><canvas id="equity-chart"></canvas></div>' +
      "</div>"
    );
  }

  function renderTrades(trades) {
    if (!trades.length) {
      return (
        '<div class="panel"><h2>Trades</h2>' +
        '<div class="chart-empty">This run has zero trades.</div></div>'
      );
    }
    var rows = trades
      .map(function (t) {
        var pnlNum = parseFloat(t.pnl);
        var pnlClass = pnlNum > 0 ? "pnl-pos" : pnlNum < 0 ? "pnl-neg" : "";
        var sideClass = t.side === "LONG" ? "long" : "short";
        return (
          "<tr>" +
          '<td><span class="side-badge ' + sideClass + '">' + escapeHtml(t.side) + "</span></td>" +
          "<td>" + escapeHtml(t.entry_time) + "</td>" +
          '<td class="num">' + escapeHtml(t.entry_price) + "</td>" +
          "<td>" + escapeHtml(t.exit_time) + "</td>" +
          '<td class="num">' + escapeHtml(t.exit_price) + "</td>" +
          '<td class="num ' + pnlClass + '">' + escapeHtml(t.pnl) + "</td>" +
          "</tr>"
        );
      })
      .join("");
    return (
      '<div class="panel"><h2>Trades (' + trades.length + ")</h2>" +
      '<div class="table-scroll"><table><thead><tr>' +
      "<th>Side</th><th>Entry Time</th><th class=\"num\">Entry Price</th>" +
      "<th>Exit Time</th><th class=\"num\">Exit Price</th><th class=\"num\">P&amp;L</th>" +
      "</tr></thead><tbody>" +
      rows +
      "</tbody></table></div></div>"
    );
  }

  function renderRun(run) {
    var trades = run.trades || [];
    mainEl.innerHTML =
      renderMetaBar(run) +
      renderMetrics(run.metrics || {}) +
      renderChartPanel() +
      renderTrades(trades);

    var canvas = document.getElementById("equity-chart");
    if (canvas) {
      var drew = drawEquityCurve(canvas, trades);
      if (!drew) {
        document.getElementById("chart-wrap").innerHTML =
          '<div class="chart-empty">No trades to chart.</div>';
      }
    }
  }

  function populateSelector() {
    selectorEl.innerHTML = "";
    RUNS.forEach(function (run, i) {
      var opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = runLabel(run);
      selectorEl.appendChild(opt);
    });
    selectorEl.addEventListener("change", function () {
      renderRun(RUNS[parseInt(selectorEl.value, 10)]);
    });
  }

  function init() {
    if (!RUNS.length) {
      selectorEl.style.display = "none";
      renderEmptyNoReports();
      return;
    }
    selectorEl.style.display = "";
    populateSelector();
    renderRun(RUNS[0]);
  }

  init();
})();
</script>

</body>
</html>
