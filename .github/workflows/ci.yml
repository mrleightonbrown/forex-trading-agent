name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql+asyncpg://forex:forex@localhost:5432/forex_agent
  TRADING_MODE: PAPER
  BROKER_ENVIRONMENT: PRACTICE
  LIVE_TRADING_COMPILED: "false"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.13"
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.13"
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run mypy .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forex
          POSTGRES_PASSWORD: forex
          POSTGRES_DB: forex_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forex -d forex_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.13"
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run alembic upgrade head
      - run: uv run pytest
