repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Local hook, not mirrors-mypy: mirrors-mypy runs in its own isolated env
  # with none of the project's dependencies installed, which produces false
  # "has type Any" errors for every third-party base class (SQLAlchemy,
  # pydantic-settings, FastAPI, ...). Running through `uv run` reuses the
  # project's own environment, matching what CI runs.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: scripts/run-mypy.sh
        language: script
        types: [python]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        # FX-46: per-row research sample CSVs (full disposition/exclusion-
        # reason detail per observation, per that story's own reproducibility
        # requirement) legitimately exceed the default 500KB -- every OTHER
        # research artifact this project has ever committed stays well under
        # it (largest before FX-46: 148KB), so this is a narrow, scoped
        # exception for exactly this file shape, not a blanket size increase
        # that would also admit an accidentally-committed large binary
        # anywhere else in the repo.
        exclude: ^research_results/.*\.csv$
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: mixed-line-ending
